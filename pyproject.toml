[tool.poetry]
name = "live_sass"
version = "0.1.0"
description = "Compile Sass and SCSS files to CSS with live reload and sourcemap support"
authors = ["biscuit-extensions"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
